name: CI

on:
  pull_request:

jobs:
  shell-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax checks
        run: |
          bash -n .opencode_web_yolo.sh
          bash -n .opencode_web_yolo_config.sh
          bash -n .opencode_web_yolo_entrypoint.sh
          bash -n .opencode_web_yolo_runtime.sh
          bash -n install.sh
          bash -n tests/fixtures/old-0.1.10/.opencode_web_yolo.sh
          bash -n tests/test_helpers.sh
          bash -n tests/test_dry_run.sh
          bash -n tests/test_build_expected_version.sh
          bash -n tests/test_runtime_defaults.sh
          bash -n tests/test_launch_mode_flags.sh
          bash -n tests/test_container_replace.sh
          bash -n tests/wrapper-dryrun.sh
          bash -n tests/test_health.sh
          bash -n tests/test_entrypoint_auth_guard.sh
          bash -n tests/test_entrypoint_instruction_flag.sh
          bash -n tests/test_entrypoint_home_pin.sh
          bash -n tests/test_startup_vacuum.sh
          bash -n tests/test_docs_apache_endpoints.sh
          bash -n tests/test_help.sh
          bash -n tests/test_playwright_dockerfile_contract.sh
          bash -n tests/test_version_command.sh
          bash -n tests/test_version_guard.sh
          bash -n tests/test_self_update.sh
          bash -n tests/test_install_bootstrap.sh
          bash -n tests/test_auth_required.sh
          bash -n tests/test_sensitive_mounts.sh
          bash -n tests/test_spec_ignore.sh
          bash -n tests/test_source_of_truth_refs.sh
          bash -n tests/test_docs_required_sections.sh
          bash -n tests/test_technical_required_sections.sh
          bash -n tests/test_session_retention.sh
          bash -n tests/run.sh
          bash -n tests/version_guard.sh
      - name: Shellcheck
        run: |
          shellcheck -x .opencode_web_yolo.sh
          shellcheck .opencode_web_yolo_config.sh
          shellcheck .opencode_web_yolo_entrypoint.sh
          shellcheck .opencode_web_yolo_runtime.sh
          shellcheck install.sh
          # Immutable archived fixture: its historical sourced config is intentionally absent.
          shellcheck -x tests/test_helpers.sh
          shellcheck -x tests/test_dry_run.sh
          shellcheck -x tests/test_build_expected_version.sh
          shellcheck -x tests/test_runtime_defaults.sh
          shellcheck -x tests/test_launch_mode_flags.sh
          shellcheck -x tests/test_container_replace.sh
          shellcheck -x tests/wrapper-dryrun.sh
          shellcheck -x tests/test_health.sh
          shellcheck -x tests/test_entrypoint_auth_guard.sh
          shellcheck -x tests/test_entrypoint_instruction_flag.sh
          shellcheck -x tests/test_entrypoint_home_pin.sh
          shellcheck -x tests/test_startup_vacuum.sh
          shellcheck -x tests/test_docs_apache_endpoints.sh
          shellcheck -x tests/test_help.sh
          shellcheck -x tests/test_playwright_dockerfile_contract.sh
          shellcheck -x tests/test_version_command.sh
          shellcheck -x tests/test_version_guard.sh
          shellcheck -x tests/test_self_update.sh
          shellcheck -x tests/test_install_bootstrap.sh
          shellcheck -x tests/test_auth_required.sh
          shellcheck -x tests/test_sensitive_mounts.sh
          shellcheck -x tests/test_spec_ignore.sh
          shellcheck -x tests/test_source_of_truth_refs.sh
          shellcheck -x tests/test_docs_required_sections.sh
          shellcheck -x tests/test_technical_required_sections.sh
          shellcheck -x tests/test_session_retention.sh
          shellcheck -x tests/run.sh
          shellcheck -x tests/version_guard.sh
      - name: JavaScript syntax check
        run: node --check .opencode_web_yolo_retention.js

  behavior-checks:
    runs-on: ubuntu-latest
    needs: shell-lint
    steps:
      - uses: actions/checkout@v4
      - name: Run behavior tests
        run: bash tests/run.sh

  install-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: shell-lint
    steps:
      - uses: actions/checkout@v4
      - name: Validate install flow
        run: |
          bash install.sh
          ~/.local/bin/opencode_web_yolo --version

  docker-validation:
    runs-on: ubuntu-latest
    needs: shell-lint
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build -f .opencode_web_yolo.Dockerfile -t opencode_web_yolo:ci .
      - name: Validate required binaries
        run: |
          docker run --rm --entrypoint sh opencode_web_yolo:ci -lc 'command -v gh && command -v git && command -v ssh && command -v sqlite3 && command -v timeout && command -v tini && opencode serve --help'
      - name: Validate Node 22 runtime metadata
        run: |
          test "$(docker run --rm --entrypoint sh opencode_web_yolo:ci -lc 'node --version')" = "$(docker run --rm --entrypoint cat opencode_web_yolo:ci /opt/opencode-web-yolo-node-version)"
          test "$(docker run --rm --entrypoint cat opencode_web_yolo:ci /opt/opencode-web-yolo-node-major)" = 22
          docker run --rm --entrypoint sh opencode_web_yolo:ci -lc 'node_version="$(node --version)"; node_major="${node_version#v}"; node_major="${node_major%%.*}"; test "${node_major}" = 22'
      - name: Validate real startup VACUUM
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)"
          trap 'rm -rf "$data_dir"' EXIT
          mkdir -p "${data_dir}/opencode"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${data_dir}:/data" \
            --entrypoint sqlite3 \
            opencode_web_yolo:ci /data/opencode/opencode.db \
            'CREATE TABLE retained (id INTEGER PRIMARY KEY, value TEXT);
             CREATE TABLE bulky (payload BLOB);
             INSERT INTO retained(value) VALUES (zeroblob(4));
             WITH RECURSIVE seq(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM seq WHERE i < 2000)
             INSERT INTO bulky(payload) SELECT zeroblob(4096) FROM seq;
             DELETE FROM bulky;'

          before_freelist="$(docker run --rm \
            -v "${data_dir}:/data" \
            --entrypoint sqlite3 \
            opencode_web_yolo:ci /data/opencode/opencode.db 'PRAGMA freelist_count;')"
          test "${before_freelist}" -gt 0

          vacuum_output="$(docker run --rm \
            -e LOCAL_UID="$(id -u)" \
            -e LOCAL_GID="$(id -g)" \
            -e LOCAL_USER=ci \
            -e OPENCODE_SERVER_PASSWORD=ci-secret \
            -e OPENCODE_WEB_RETENTION_DAYS=0 \
            -e XDG_DATA_HOME=/data \
            -v "${data_dir}:/data" \
            --entrypoint /usr/local/bin/opencode_web_yolo_entrypoint.sh \
            opencode_web_yolo:ci true 2>&1)"
          case "${vacuum_output}" in
            *"VACUUM: compacting OpenCode database at /data/opencode/opencode.db."*) ;;
            *) printf '%s\n' "${vacuum_output}" >&2; exit 1 ;;
          esac
          case "${vacuum_output}" in
            *WARNING*) printf '%s\n' "${vacuum_output}" >&2; exit 1 ;;
          esac

          retained_rows="$(docker run --rm \
            -v "${data_dir}:/data" \
            --entrypoint sqlite3 \
            opencode_web_yolo:ci /data/opencode/opencode.db 'SELECT count(*) FROM retained;')"
          after_freelist="$(docker run --rm \
            -v "${data_dir}:/data" \
            --entrypoint sqlite3 \
            opencode_web_yolo:ci /data/opencode/opencode.db 'PRAGMA freelist_count;')"
          test "${retained_rows}" = 1
          test "${after_freelist}" = 0
      - name: Smoke test authenticated opencode serve
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          container_name=opencode_web_yolo_ci_smoke
          host_port=4097
          cleanup() {
            local status=$?
            trap - EXIT
            if [ "${status}" -ne 0 ]; then
              docker logs "${container_name}" || true
            fi
            docker rm -f "${container_name}" >/dev/null 2>&1 || true
            rm -rf "${smoke_dir}"
            exit "${status}"
          }
          trap cleanup EXIT
          mkdir -p "${smoke_dir}/config" "${smoke_dir}/data"

          docker run -d \
            --name "${container_name}" \
            --restart unless-stopped \
            -p "127.0.0.1:${host_port}:${host_port}" \
            -e LOCAL_UID="$(id -u)" \
            -e LOCAL_GID="$(id -g)" \
            -e LOCAL_USER=ci \
            -e OPENCODE_SERVER_PASSWORD=ci-secret \
            -e OPENCODE_SERVER_USERNAME=opencode \
            -e OPENCODE_WEB_PORT="${host_port}" \
            -e HOME=/home/opencode \
            -e XDG_CONFIG_HOME=/home/opencode/.config \
            -e XDG_DATA_HOME=/home/opencode/.local/share \
            -e XDG_STATE_HOME=/home/opencode/.local/share/opencode/state \
            -v "${smoke_dir}/config:/home/opencode/.config/opencode" \
            -v "${smoke_dir}/data:/home/opencode/.local/share/opencode" \
            opencode_web_yolo:ci \
            opencode serve --hostname 0.0.0.0 --port "${host_port}" >/dev/null

          healthy=0
          unauthenticated_status=''
          health_body=''
          for attempt in $(seq 1 60); do
            if unauthenticated_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 2 "http://127.0.0.1:${host_port}/global/health" 2>/dev/null)" \
              && [ "${unauthenticated_status}" = 401 ] \
              && health_body="$(curl -fsS --max-time 2 -u 'opencode:ci-secret' "http://127.0.0.1:${host_port}/global/health" 2>/dev/null)" \
              && node -e 'const value = JSON.parse(process.argv[1]); process.exit(value && value.healthy === true ? 0 : 1)' "${health_body}"; then
              healthy=1
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "${container_name}" 2>/dev/null || true)" != true ]; then
              break
            fi
            sleep 1
          done
          test "${unauthenticated_status}" = 401
          test "${healthy}" = 1
      - name: Build Playwright-enabled runtime image
        run: |
          docker build \
            --build-arg OPENCODE_WEB_BUILD_PLAYWRIGHT=1 \
            --build-arg PLAYWRIGHT_VERSION=1.62.1 \
            -f .opencode_web_yolo.Dockerfile \
            -t opencode_web_yolo:ci-playwright .
      - name: Validate Playwright runtime
        run: |
          docker run --rm --entrypoint sh opencode_web_yolo:ci-playwright -lc '
            command -v playwright
            test "$(printenv PLAYWRIGHT_BROWSERS_PATH)" = /ms-playwright
            test "$(cat /opt/opencode-web-yolo-playwright)" = 1
            test "$(cat /opt/opencode-web-yolo-playwright-version)" = 1.62.1
            test "$(cat /opt/opencode-web-yolo-playwright-expected-version)" = 1.62.1
            found=0
            for executable in /ms-playwright/chromium-*/chrome-linux/chrome /ms-playwright/chromium-*/chrome-linux64/chrome; do
              if test -x "$executable"; then found=1; fi
            done
            test "$found" = 1
          '

  version-discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version format and drift guard
        env:
          VERSION_GUARD_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: bash tests/version_guard.sh
